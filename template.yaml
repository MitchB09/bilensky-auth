AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: home-page

Parameters:
  CertificateId:
    Type: String
    Description: AWS Certificate ID
  Stage:
    Type: String
    Description: The Stage where the application is running in, e.g., dev, prod.

Conditions:
  IsProduction: 
    !Equals [!Ref Stage, "prod"]

Globals:
  Function:
    Timeout: 5
    Handler: index.handler
    Runtime: nodejs22.x
    Environment:
      Variables:
        ENTITY_TABLE: !Ref EntityTable


Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Metadata:
      com.aws.cloudformation.Context: 
        why: "Userpool for all shared apps"
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolName: !Sub '${AWS::StackName}-${Stage}-user-pool'
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: True
          RequireNumbers: False
          RequireSymbols: True
          RequireUppercase: True

  UserPoolDomain:
    Metadata:
      com.aws.cloudformation.Context: 
        why: "Configuring custom domain for userpool"
    Type: AWS::Cognito::UserPoolDomain
    Properties: 
      Domain: !If [IsProduction, !Sub 'auth.bilensky.ca', !Sub 'auth-${Stage}.bilensky.ca' ]
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
      CustomDomainConfig:
        CertificateArn: !Sub arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${CertificateId}

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: 
      Name: !Sub "${AWS::StackName}-UserPoolId"
    Description: "Userpool ID of Bilensky Auth"
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: 
      Name: !Sub "${AWS::StackName}-UserPoolArn"
    Description: "Userpool Arn of Bilensky Auth"
  UserPoolDomain:
    Value: !Ref UserPoolDomain
    Export: 
      Name: !Sub "${AWS::StackName}-UserPoolDomain"
    Description: "Userpool Domain of Bilensky Auth"


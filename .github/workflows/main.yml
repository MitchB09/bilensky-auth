
name: Validate and Deploy
env:
  NODE_VERSION: '24.x'   # set this to the node version to use

# Controls when the action will run. 
on:
  # Triggers the workflow on push for the master branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Need ID token write permission to use OIDC
permissions:
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    name: Validate and Build
    runs-on: ubuntu-latest
    environment: main
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # Fetches the current commit and its immediate parent

    # - name: Configure AWS Credentials
    #   uses: aws-actions/configure-aws-credentials@v6.1.0
    #   with:
    #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
    #     aws-region: us-east-1

    - uses: aws-actions/setup-sam@v3
      with:
        use-installer: true

    - name: Validate
      run: sam validate --region 'us-east-1'

    # - name: Build
    #   # Build inside Docker containers
    #   run: sam build --use-container
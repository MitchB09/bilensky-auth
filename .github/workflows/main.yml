
name: Build and Deploy UI
env:
  NODE_VERSION: '24.x'   # set this to the node version to use

# Controls when the action will run. 
on:
  # Triggers the workflow on push for the master branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Need ID token write permission to use OIDC
permissions:
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: main
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # Fetches the current commit and its immediate parent

    - uses: aws-actions/setup-sam@v3
      with:
        use-installer: true
      env:
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Validate
      run: sam validate

    - name: Build
      # Build inside Docker containers
      run: sam build --use-container